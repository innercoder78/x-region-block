name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541dca1515407b8e9af47d1d33e95f
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify release invariants
        run: npm run verify:release

      - name: Build distributable packages
        run: npm run package:release && npm run verify:packages

      - name: Retain tested installation packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: x-region-block-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
